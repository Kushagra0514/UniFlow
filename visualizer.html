<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>UGA Degree Path Visualizer</title>
    <script src="d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: "Outfit", ui-sans-serif, system-ui, sans-serif;
            --font-display: "Syne", sans-serif;
            
            --color-white-smoke: #F6F5F3;
            --color-parchment: #ECE9E4;
            --color-dust-grey: #D2CEC6;
            --color-silver: #AFA99D;
            --color-charcoal: #514D48;
            --color-graphite: #363430;
            --color-carbon-black: #211F1D;
            --color-pitch-black: #11100E;
            
            --color-background-dark: var(--color-pitch-black);
            --color-primary-text: var(--color-white-smoke);
            --color-primary-accent: var(--color-white-smoke);
            --color-surface-glass: rgba(33, 31, 29, 0.4);
            --color-text-muted: var(--color-charcoal);
            
            /* Status Colors */
            --color-status-taken-fill: #10B981;    /* Green */
            --color-status-taken-stroke: #059669;
            --color-status-progress-fill: #FBBF24; /* Yellow */
            --color-status-progress-stroke: #D97706;
            --color-status-needed-fill: #6B7280;   /* Gray */
            --color-status-needed-stroke: #4B5563;
            
            overflow: hidden;
        }

        /* Light Mode Overrides */
        :root.light {
            --color-background-dark: var(--color-white-smoke);
            --color-primary-text: var(--color-pitch-black);
            --color-surface-glass: rgba(255, 255, 255, 0.7);
            --color-text-muted: var(--color-charcoal);
        }
        :root.light .ambient-glow {
            background: radial-gradient(circle, rgba(17, 16, 14, 0.03) 0%, rgba(255, 255, 255, 0) 70%);
        }
        :root.light #header, :root.light #ai-sidebar {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(17, 16, 14, 0.08);
        }
        :root.light #header h2 { color: var(--color-pitch-black); }
        :root.light #header-stats { color: var(--color-charcoal); }
        :root.light #major-display { color: var(--color-charcoal) !important; }
        :root.light #gpa-display, :root.light #progress-display { color: var(--color-pitch-black) !important; }
        :root.light #ai-sidebar h3 { color: var(--color-pitch-black); }
        :root.light #ai-status { color: var(--color-charcoal); }
        :root.light #ai-output { 
            background: rgba(246, 245, 243, 0.4); 
            border-color: rgba(17, 16, 14, 0.08);
        }
        :root.light input[type="text"] {
            background: rgba(246, 245, 243, 0.8);
            color: var(--color-pitch-black);
            border-color: rgba(17, 16, 14, 0.15);
        }
        :root.light button {
            background: var(--color-pitch-black);
            color: var(--color-white-smoke);
        }
        :root.light button.theme-toggle {
            background: var(--color-charcoal);
            color: var(--color-white-smoke);
        }
        :root.light button:hover { background: var(--color-carbon-black); }
        :root.light button.theme-toggle:hover { background: var(--color-graphite); }
        :root.light button:disabled { background: var(--color-dust-grey); color: var(--color-charcoal); }
        :root.light .node text {
            fill: var(--color-pitch-black);
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }
        :root.light .legend-item { color: var(--color-charcoal); }
        :root.light .glass-panel { border-color: rgba(17, 16, 14, 0.15); }
        :root.light #error-overlay { background: rgba(246, 245, 243, 0.85); color: var(--color-pitch-black); }
        :root.light .link { stroke: var(--color-dust-grey); opacity: 0.8; }

        body { 
            background: var(--color-background-dark); 
            color: var(--color-primary-text); 
            font-family: var(--font-sans); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            transition: background 0.3s, color 0.3s;
        }

        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(239, 234, 226, 0.05) 0%, rgba(17, 16, 14, 0) 70%);
            pointer-events: none;
            z-index: 0;
            transition: background 0.3s;
        }

        .glass-panel {
            background: var(--color-surface-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(230, 226, 224, 0.08);
            transition: background 0.3s, border-color 0.3s;
        }

        #header { 
            padding: 20px 30px; 
            z-index: 10; 
            flex-shrink: 0; 
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #header h2 {
            margin: 0;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 24px;
            color: var(--color-white-smoke);
            letter-spacing: -0.02em;
            transition: color 0.3s;
        }
        
        #header-stats {
            color: var(--color-silver);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #main-content { display: flex; flex-grow: 1; overflow: hidden; position: relative; }
        
        #tree-container { flex-grow: 1; height: 100%; cursor: grab; background: transparent; position: relative; z-index: 1; }
        
        #ai-sidebar { 
            width: 380px; 
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
            z-index: 20; 
            margin: 0 20px 20px 0;
            border-radius: 16px;
        }

        #ai-sidebar h3 {
            margin-top: 0;
            font-family: var(--font-display);
            font-size: 18px;
            color: var(--color-white-smoke);
            font-weight: 700;
            transition: color 0.3s;
        }

        #ai-status { font-size: 12px; color: var(--color-silver); margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; transition: color 0.3s; }

        /* Session Bar */
        #session-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .session-btn {
            flex: 1;
            padding: 7px 10px;
            font-size: 11px;
            font-family: var(--font-sans);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border: 1px solid rgba(230, 226, 224, 0.12);
            border-radius: 8px;
            background: rgba(230, 226, 224, 0.06);
            color: var(--color-silver);
            cursor: pointer;
            transition: all 0.2s;
        }
        .session-btn:hover {
            background: rgba(230, 226, 224, 0.14);
            color: var(--color-white-smoke);
            transform: none;
        }
        .session-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        #history-count { opacity: 0.5; }

        /* Saved Sessions Drawer */
        #saved-sessions {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
            border: 1px solid rgba(230, 226, 224, 0.08);
            border-radius: 10px;
            background: rgba(17, 16, 14, 0.35);
            transition: all 0.25s ease;
        }
        #saved-sessions.hidden { display: none; }

        .session-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(230, 226, 224, 0.05);
            transition: background 0.15s;
        }
        .session-card:last-child { border-bottom: none; }
        .session-card:hover { background: rgba(230, 226, 224, 0.08); }

        .session-card .session-info {
            flex: 1;
            min-width: 0;
        }
        .session-card .session-preview {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--color-parchment);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-card .session-time {
            font-size: 10px;
            color: var(--color-silver);
            opacity: 0.6;
            margin-top: 2px;
        }
        .session-card .session-delete {
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            color: var(--color-silver);
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.15s;
            padding: 0;
            flex-shrink: 0;
        }
        .session-card:hover .session-delete { opacity: 0.6; }
        .session-card .session-delete:hover { opacity: 1; background: rgba(239, 68, 68, 0.15); color: #EF4444; transform: none; }

        .sessions-empty {
            padding: 16px;
            text-align: center;
            font-size: 12px;
            color: var(--color-silver);
            opacity: 0.5;
        }

        /* Light mode session overrides */
        :root.light .session-btn {
            background: rgba(17, 16, 14, 0.04);
            border-color: rgba(17, 16, 14, 0.1);
            color: var(--color-charcoal);
        }
        :root.light .session-btn:hover { background: rgba(17, 16, 14, 0.08); color: var(--color-pitch-black); }
        :root.light #saved-sessions { background: rgba(246, 245, 243, 0.6); border-color: rgba(17, 16, 14, 0.08); }
        :root.light .session-card:hover { background: rgba(17, 16, 14, 0.04); }
        :root.light .session-card .session-preview { color: var(--color-graphite); }
        :root.light .session-card .session-time { color: var(--color-charcoal); }
        
        #ai-output { 
            flex-grow: 1; 
            background: rgba(17, 16, 14, 0.3); 
            border: 1px solid rgba(230, 226, 224, 0.06); 
            border-radius: 12px;
            padding: 16px 12px; 
            font-size: 14px; 
            color: var(--color-dust-grey); 
            overflow-y: auto; 
            margin-bottom: 15px; 
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }

        /* Chat Bubble System */
        .chat-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13.5px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: bubbleIn 0.25s ease-out;
        }

        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(8px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .chat-bubble.user {
            align-self: flex-end;
            background: var(--color-white-smoke);
            color: var(--color-pitch-black);
            border-bottom-right-radius: 4px;
        }

        .chat-bubble.ai {
            align-self: flex-start;
            background: rgba(230, 226, 224, 0.1);
            color: var(--color-parchment);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(230, 226, 224, 0.08);
        }

        .chat-bubble.ai.streaming {
            border-color: rgba(230, 226, 224, 0.15);
        }

        .chat-bubble .bubble-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
            opacity: 0.5;
        }

        .chat-bubble.user .bubble-label { color: var(--color-charcoal); }
        .chat-bubble.ai .bubble-label { color: var(--color-silver); }

        .chat-welcome {
            text-align: center;
            color: var(--color-silver);
            font-size: 13px;
            padding: 20px 10px;
            opacity: 0.7;
        }

        /* Typing indicator and skeleton bubbles */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 4px 4px 4px;
        }

        .typing-indicator span {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: var(--color-silver);
            border-radius: 50%;
            opacity: 0.4;
            animation: typingPulse 1.4s infinite both;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingPulse {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 0.9;
            }
        }

        /* Light mode bubble overrides */
        :root.light .chat-bubble.user {
            background: var(--color-pitch-black);
            color: var(--color-white-smoke);
        }
        :root.light .chat-bubble.user .bubble-label { color: var(--color-silver); }
        :root.light .chat-bubble.ai {
            background: rgba(17, 16, 14, 0.06);
            color: var(--color-graphite);
            border-color: rgba(17, 16, 14, 0.1);
        }
        :root.light .chat-bubble.ai .bubble-label { color: var(--color-charcoal); }

        #chat-container { display: flex; gap: 8px; }
        
        input[type="text"] {
            flex-grow: 1; 
            background: rgba(17, 16, 14, 0.6); 
            color: var(--color-white-smoke); 
            border: 1px solid rgba(230, 226, 224, 0.15); 
            padding: 12px 16px; 
            font-family: inherit;
            border-radius: 8px;
            outline: none;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--color-silver);
        }

        button { 
            background: var(--color-white-smoke); 
            color: var(--color-pitch-black); 
            border: none; 
            padding: 12px 20px; 
            cursor: pointer; 
            font-family: var(--font-sans); 
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s; 
        }

        button.theme-toggle {
            padding: 8px 12px;
            font-size: 12px;
            background: var(--color-charcoal);
            color: var(--color-white-smoke);
        }

        button.theme-toggle:hover {
            background: var(--color-silver);
            color: var(--color-pitch-black);
        }

        button:hover { 
            background: var(--color-parchment); 
            transform: translateY(-1px);
        }
        
        button:disabled { 
            background: var(--color-carbon-black); 
            color: var(--color-charcoal); 
            cursor: not-allowed; 
            transform: none;
        }

        /* D3 Visualizer Nodes */
        .node circle { 
            stroke-width: 2px; 
            transition: r 0.3s, fill 0.3s, stroke 0.3s; 
        }
        .node:hover circle { r: 8px; }
        .node text { 
            font-size: 11px; 
            font-family: var(--font-sans);
            font-weight: 600;
            fill: var(--color-white-smoke); 
            pointer-events: none; 
            paint-order: stroke fill;
            stroke: var(--color-background-dark);
            stroke-width: 4px;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: fill 0.3s, stroke 0.3s;
        }
        
        .link { fill: none; stroke: var(--color-charcoal); stroke-width: 1.5px; opacity: 0.2; transition: stroke 0.3s; }
        
        /* Node Status Colors */
        .status-taken { stroke: var(--color-status-taken-stroke); fill: var(--color-status-taken-fill) !important; }
        .status-progress { stroke: var(--color-status-progress-stroke); stroke-dasharray: 4; fill: var(--color-status-progress-fill) !important; }
        .status-needed { stroke: var(--color-status-needed-stroke); fill: var(--color-status-needed-fill) !important; }

        .legend { 
            position: fixed; 
            bottom: 24px; 
            left: 24px; 
            padding: 16px 20px; 
            z-index: 100; 
            pointer-events: none; 
            display: flex;
            gap: 20px;
            border-radius: 12px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--color-silver);
            transition: color 0.3s;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        #error-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: rgba(17, 16, 14, 0.85); 
            backdrop-filter: blur(8px);
            color: var(--color-white-smoke); 
            z-index: 50; 
            display: none; 
            text-align: center; 
            padding: 20px; 
            font-family: var(--font-display);
            font-size: 20px;
            transition: background 0.3s, color 0.3s;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div id="header" class="glass-panel" style="border-radius: 0; border-top: none; border-left: none; border-right: none; margin-bottom: 20px;">
        <h2>UniFlow // <span id="major-display" style="color: var(--color-silver); font-weight: 400;">INITIALIZING...</span></h2>
        <div id="header-stats">
            <div>GPA: <span id="gpa-display" style="color: var(--color-white-smoke)">-</span> | PROGRESS: <span id="progress-display" style="color: var(--color-white-smoke)">-</span>%</div>
            <button id="theme-toggle" class="theme-toggle">Light Mode</button>
        </div>
    </div>

    <div id="main-content">
        <div id="tree-container">
            <div id="error-overlay"></div>
        </div>
        <div id="ai-sidebar" class="glass-panel">
            <h3>AI Assistant</h3>
            <div id="ai-status" class="ai-status">Checking WebLLM...</div>
            <div id="session-bar">
                <button id="new-chat-btn" class="session-btn" title="Start a new conversation">+ New Chat</button>
                <button id="history-toggle-btn" class="session-btn" title="View saved chats">History <span id="history-count"></span></button>
            </div>
            <div id="saved-sessions" class="hidden">
                <div id="sessions-list"></div>
            </div>
            <div id="ai-output"><div class="chat-welcome">Welcome to UniFlow. Load your degree data to enable AI scheduling advice.</div></div>
            <div id="chat-container">
                <input type="text" id="ai-input" placeholder="Ask about your degree...">
                <button id="ai-btn" disabled>SEND</button>
            </div>
        </div>
    </div>

    <div class="legend glass-panel">
        <div class="legend-item"><div class="legend-dot" style="background: var(--color-status-taken-fill); border: 2px solid var(--color-status-taken-stroke);"></div>Completed</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--color-status-progress-fill); border: 2px dashed var(--color-status-progress-stroke);"></div>In Progress</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--color-status-needed-fill); border: 2px solid var(--color-status-needed-stroke);"></div>Needed</div>
    </div>


    <script src="transformer.js"></script>
    <script src="visualizer.js"></script>
    <script type="module" src="ai_advisor.js"></script>
</body>
</html>
